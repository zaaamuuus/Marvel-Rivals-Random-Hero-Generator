<title>Rivals Roulette</title>
<style>
:root{--bg:#0e1016;--surface:#181b25;--text:#f2f4f8;--muted:#8a91a3;--line:#262a38;--V:#3b82f6;--D:#ef4444;--S:#22c55e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f4f8;--surface:#fff;--text:#12141c;--muted:#656c80;--line:#dde0ea;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0e1016;--surface:#181b25;--text:#f2f4f8;--muted:#8a91a3;--line:#262a38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center}
main{width:100%;max-width:440px;padding:20px 18px 28px;display:flex;flex-direction:column;gap:16px;flex:1}
h1{margin:0;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:700}
.chips{display:flex;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{color:#fff;border-color:transparent;background:var(--c,#555)}
.chip[data-r="all"]{--c:#6366f1}.chip[data-r="V"]{--c:var(--V)}.chip[data-r="D"]{--c:var(--D)}.chip[data-r="S"]{--c:var(--S)}
.card{position:relative;overflow:hidden;border-radius:26px;aspect-ratio:4/5;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--rc,#6366f1) 70%,#000) 0%,color-mix(in srgb,var(--rc,#6366f1) 25%,var(--surface)) 62%,var(--surface) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:22px;transition:background .3s}
.mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(46vw,190px);font-weight:900;letter-spacing:-.04em;color:rgba(255,255,255,.2);padding-bottom:70px;user-select:none}
.av{position:absolute;top:7%;left:50%;transform:translateX(-50%);width:60%;aspect-ratio:1;object-fit:cover;border-radius:24px;box-shadow:0 12px 32px rgba(0,0,0,.45);display:none}
.pr{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:none;z-index:0;animation:fadein .35s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.card::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,rgba(0,0,0,.4) 32%,transparent 58%)}
.badge,.name,.tag,.see,.hint{z-index:2}.badge{position:relative}.hint{z-index:2}
.card.spin .mono{filter:blur(1.5px)}
.card.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.94)}100%{transform:scale(1)}}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);color:#fff;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.badge svg{width:16px;height:16px;fill:currentColor}
.name{position:relative;margin:10px 0 0;font-size:clamp(30px,9vw,40px);font-weight:900;line-height:1.05;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.hint{position:absolute;top:18px;left:0;right:0;text-align:center;color:rgba(255,255,255,.65);font-size:13px}
.go{border:0;border-radius:20px;padding:20px;font-size:19px;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,#6366f1,#a855f7);cursor:pointer;box-shadow:0 10px 28px rgba(99,102,241,.35);transition:transform .1s}
.go:active{transform:scale(.97)}.go:disabled{opacity:.7}
.hist{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:30px}
.h{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-left:4px solid var(--c)}
.foot{text-align:center;color:var(--muted);font-size:12px}
[hidden]{display:none!important}
.bbtn{align-self:center;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;overflow:hidden;border:0;padding:0;border-radius:14px;aspect-ratio:3/4;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#000),color-mix(in srgb,var(--c) 25%,var(--surface)));cursor:pointer;border-bottom:4px solid var(--c);color:#fff;text-align:left}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 55%)}
.tn,.tr{position:absolute;left:8px;right:8px;z-index:2}
.tn{bottom:20px;font-size:12px;font-weight:800;line-height:1.1}
.tr{bottom:6px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.ti{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:rgba(255,255,255,.25)}
.tag{position:relative;margin:8px 0 0;color:rgba(255,255,255,.85);font-size:15px;line-height:1.35;min-height:2.7em}
.see{position:relative;align-self:flex-start;margin-top:10px;color:#fff;font-size:14px;font-weight:700;text-decoration:none;background:rgba(0,0,0,.35);padding:9px 14px;border-radius:12px;visibility:hidden}
</style>
</head>
<body>
<main>
  <h1>Rivals Roulette</h1>
  <div class="chips" id="chips">
    <button class="chip" data-r="all" aria-pressed="true">All</button>
    <button class="chip" data-r="V" aria-pressed="false">Vanguard</button>
    <button class="chip" data-r="D" aria-pressed="false">Duelist</button>
    <button class="chip" data-r="S" aria-pressed="false">Strategist</button>
  </div>
  <button class="bbtn" id="browse">Browse all heroes</button>
  <div class="card" id="card">
    <img class="pr" id="pr" alt="">
    <img class="av" id="av" alt="">
    <div class="hint" id="hint">Tap roll to pick your hero</div>
    <span class="badge" id="badge" style="visibility:hidden"></span>
    <h2 class="name" id="name">Who's it gonna be?</h2>
    <div class="tag" id="tag"></div>
    <a class="see" id="see" target="_blank" rel="noopener" href="#">See pictures ↗</a>
  </div>
  <button class="go" id="go">ROLL</button>
  <div class="hist" id="hist"></div>
  <div class="grid" id="grid" hidden></div>
  <div class="foot" id="foot"></div>
</main>
<script>
const ROLE={V:{n:"Vanguard",c:"#3b82f6",i:"M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z"},
 D:{n:"Duelist",c:"#ef4444",i:"M13 2 4 14h7l-1 8 9-12h-7z"},
 S:{n:"Strategist",c:"#22c55e",i:"M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"},
 M:{n:"Multi-role",c:"#a855f7",i:"M12 2l3 7 7 .6-5.300 4.700 1.600 7.200L12 17.800 5.700 21.500l1.600-7.200L2 9.600 9 9z"}};
const V=["Angela","Bruce Banner","Captain America","Devil Dinosaur","Doctor Strange","Emma Frost","Groot","Magneto","Peni Parker","Rogue","The Hood","The Thing","Thor","Venom"];
const D=["Black Cat","Black Panther","Black Widow","Blade","Cyclops","Daredevil","Elsa Bloodstone","Gorr the God Butcher","Hawkeye","Hela","Human Torch","Iron Fist","Iron Man","Magik","Mister Fantastic","Moon Knight","Namor","Phoenix","Psylocke","Scarlet Witch","Spider-Man","Squirrel Girl","Star-Lord","Storm","The Punisher","Winter Soldier","Wolverine"];
const S=["Adam Warlock","Cloak & Dagger","Gambit","Invisible Woman","Jeff the Land Shark","Jubilee","Loki","Luna Snow","Mantis","Rocket Raccoon","Ultron","White Fox"];
const HEROES=[...V.map(n=>({n,r:["V"]})),...D.map(n=>({n,r:["D"]})),...S.map(n=>({n,r:["S"]})),{n:"Deadpool",r:["V","D","S"]}];
const TAGS={"Angela":"Asgardian warrior with a golden spear and wings","Bruce Banner":"Scientist who turns into the big green Hulk","Captain America":"Super soldier with a round shield","Devil Dinosaur":"Giant red T-rex","Doctor Strange":"Sorcerer in a red cloak","Emma Frost":"White-clad telepath who turns into diamond","Groot":"Walking tree, says only 'I am Groot'","Magneto":"Master of magnetism, red and purple helmet","Peni Parker":"Young girl piloting a spider mech","Rogue":"Flying mutant in green and gold","The Hood":"Dark hooded sorcerer-thief","The Thing":"Rocky orange strongman (Fantastic Four)","Thor":"God of thunder with a hammer","Venom":"Black alien symbiote with a long tongue","Black Cat":"Thief in a white-and-black catsuit","Black Panther":"King of Wakanda, black suit and claws","Black Widow":"Spy in black with pistols and a sniper rifle","Blade":"Vampire hunter in a long black coat with a sword","Cyclops":"X-Men leader with a red visor that fires beams","Daredevil":"Blind lawyer in a red suit with batons","Elsa Bloodstone":"Monster hunter with a glowing red gem","Gorr the God Butcher":"Pale alien with a black sword that kills gods","Hawkeye":"Archer in purple with a bow","Hela":"Goddess of death with a horned crown","Human Torch":"Flying hero covered in fire (Fantastic Four)","Iron Fist":"Kung-fu master with a glowing golden fist","Iron Man":"Red and gold armored genius","Magik":"Teleporting sorceress with a glowing soulsword","Mister Fantastic":"Stretchy scientist (Fantastic Four)","Moon Knight":"White-cloaked fighter with crescent blades","Namor":"Atlantean king with a trident, flies with ankle wings","Phoenix":"Jean Grey wrapped in cosmic fire","Psylocke":"Ninja telepath with a psychic blade","Scarlet Witch":"Red-clad witch with chaos magic","Spider-Man":"Wall-crawler in red and blue","Squirrel Girl":"Girl with a squirrel tail and squirrel sidekick","Star-Lord":"Space outlaw with a mask and twin blasters","Storm":"White-haired weather goddess","The Punisher":"Skull-chest vigilante with heavy guns","Winter Soldier":"Masked assassin with a metal arm","Wolverine":"Mutant with metal claws, yellow suit","Adam Warlock":"Golden cosmic being with a gem on his forehead","Cloak & Dagger":"Duo: dark teleporting cloak and light daggers","Gambit":"Cajun thief in a trench coat throwing charged cards","Invisible Woman":"Turns invisible and makes force fields (Fantastic Four)","Jeff the Land Shark":"Cute land shark that swallows enemies","Jubilee":"Teen in a yellow jacket throwing fireworks","Loki":"Trickster god in green and gold, horned helmet","Luna Snow":"Ice-powered K-pop star","Mantis":"Green-skinned empath with antennae","Rocket Raccoon":"Talking raccoon with big guns","Ultron":"Evil robot with glowing red eyes","White Fox":"Fox-spirit girl with nine tails","Deadpool":"Red-suited mercenary who never shuts up (any role)"};
const $=id=>document.getElementById(id);
let filter="all",last=null,busy=false,hist=[];
function rand(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
function mono(n){const w=n.replace(/[&]/g,"").split(/[\s-]+/).filter(w=>w&&w.toLowerCase()!=="the"&&w.toLowerCase()!=="of");return (w.length>1?w[0][0]+w[1][0]:w[0].slice(0,2)).toUpperCase()}
function pool(){return HEROES.filter(h=>filter==="all"||h.r.includes(filter))}
const SL={"Bruce Banner":"hulk","Cloak & Dagger":"cloak-and-dagger"};
const imgUrl=n=>"https://rivalskins.com/wp-content/uploads/marvel-assets/ui/heroes/avatar/"+(SL[n]||n.toLowerCase().replace(/[^a-z0-9]+/g,"-"))+"_avatar.png";
const PB="https://rivalskins.com/wp-content/uploads/marvel-assets/assets/hero-prestige-images/";
const HAVE=new Set("adam-warlock angela black-panther black-widow blade captain-america cloak-and-dagger daredevil doctor-strange emma-frost gambit groot hawkeye hela hulk human-torch invisible-woman iron-fist iron-man jeff-the-land-shark loki luna-snow magik magneto mantis mister-fantastic moon-knight namor peni-parker phoenix psylocke rocket-raccoon scarlet-witch spider-man squirrel-girl star-lord storm the-punisher the-thing thor ultron venom winter-soldier wolverine".split(" "));
const slug=n=>SL[n]||n.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const NID={"Deadpool":1057,"Elsa Bloodstone":1059,"White Fox":1060,"Black Cat":1061,"Devil Dinosaur":1062,"Cyclops":1063,"Jubilee":1064,"Rogue":1065,"The Hood":1066,"Gorr the God Butcher":1067};
const prUrl=n=>{if(NID[n])return PB+"img_prestige_"+NID[n]+"0010_hero.png";const k=slug(n);return HAVE.has(k)?PB+k+(k==="angela"?"_restige":"_prestige")+".png":null};
const IC={};
function loadImg(url,cb){let e=IC[url];if(!e){e=IC[url]={img:new Image(),state:0,cbs:[]};e.img.onload=()=>{e.state=1;e.cbs.splice(0).forEach(f=>f(true))};e.img.onerror=()=>{e.state=2;e.cbs.splice(0).forEach(f=>f(false))};e.img.src=url}
 if(e.state===1)cb(true);else if(e.state===2)cb(false);else e.cbs.push(cb)}
let token=0;
function hideImgs(){$("pr").style.display="none";$("av").style.display="none"}
function setAv(n){const t=++token,p=$("pr"),a=$("av"),pu=prUrl(n),urls=[pu,imgUrl(n)].filter(Boolean);hideImgs();
 (function next(i){if(i>=urls.length||t!==token)return;loadImg(urls[i],ok=>{if(t!==token)return;if(!ok)return next(i+1);const el=urls[i]===pu?p:a;el.src=urls[i];el.style.display="block"})})(0)}
function show(h,role,skip){const R=ROLE[role];$("card").style.setProperty("--rc",R.c);$("name").textContent=h.n;$("tag").textContent=TAGS[h.n]||"";if(skip){token++;hideImgs()}else setAv(h.n);const s=$("see");s.href="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(h.n+" Marvel Rivals");s.style.visibility=busy?"hidden":"visible";
 const b=$("badge");b.style.visibility="visible";b.innerHTML='<svg viewBox="0 0 24 24"><path d="'+R.i+'"/></svg>'+R.n}
function roll(){
  if(busy)return;const p=pool();let cand=p.filter(h=>h.n!==last);if(!cand.length)cand=p;
  const pick=cand[rand(cand.length)],role=pick.r[rand(pick.r.length)];
  busy=true;$("go").disabled=true;$("hint").textContent="";$("card").classList.add("spin");
  const steps=18;let i=0;
  (function tick(){
    if(i<steps){const h=p[rand(p.length)];show(h,h.r[rand(h.r.length)],1);i++;setTimeout(tick,45+i*i*0.9)}
    else{show(pick,role);const c=$("card");c.classList.remove("spin","pop");void c.offsetWidth;c.classList.add("pop");
      last=pick.n;hist.unshift({n:pick.n,c:ROLE[role].c});hist=hist.slice(0,6);renderHist();
      if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}
      busy=false;$("see").style.visibility="visible";$("go").disabled=false;$("go").textContent="ROLL AGAIN"}
  })();
}
function renderHist(){$("hist").innerHTML=hist.slice(1).map(h=>'<span class="h" style="--c:'+h.c+'">'+h.n.replace(/&/g,"&amp;")+'</span>').join("")}
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.r;document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b));updFoot();if(browsing)renderGrid()});
function updFoot(){const n=pool().length;$("foot").textContent=n+" hero"+(n>1?"es":"")+" in the pool"}
let browsing=false;
const esc=t=>t.replace(/&/g,"&amp;");
function renderGrid(){$("grid").innerHTML=pool().slice().sort((a,b)=>a.n.localeCompare(b.n)).map(h=>{const m=h.r.length>1?"M":h.r[0];
 return '<button class="tile" data-n="'+esc(h.n)+'" style="--c:'+ROLE[m].c+'"><span class="ti">'+mono(h.n)+'</span><img loading="lazy" alt="" src="'+(prUrl(h.n)||imgUrl(h.n))+'" onerror="this.style.display=\'none\'"><span class="tn">'+esc(h.n)+'</span><span class="tr">'+ROLE[m].n+'</span></button>'}).join("")}
function setBrowse(on){browsing=on;["card","go","hist"].forEach(id=>$(id).hidden=on);$("grid").hidden=!on;$("browse").textContent=on?"\u2190 Back to roller":"Browse all heroes";if(on)renderGrid();window.scrollTo(0,0)}
function inspect(h){if(busy)return;setBrowse(false);last=h.n;show(h,h.r.length>1?"M":h.r[0]);$("hint").textContent="";const c=$("card");c.classList.remove("spin","pop");void c.offsetWidth;c.classList.add("pop")}
$("browse").onclick=()=>setBrowse(!browsing);
$("grid").onclick=e=>{const b=e.target.closest(".tile");if(b)inspect(HEROES.find(x=>x.n===b.dataset.n))};
$("go").onclick=roll;updFoot();(function pre(i){if(i>=HEROES.length)return;const n=HEROES[i].n;loadImg(prUrl(n)||imgUrl(n),()=>pre(i+1))})(0);
</script>
</body>
</html>
